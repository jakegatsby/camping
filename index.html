<!DOCTYPE html>
<html lang="en" data-theme="light">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Camping Checklist</title>
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@picocss/pico@2/css/pico.min.css">
  <style>
    ul,
    ol,
    article ul,
    article ol,
    main ul,
    main ol {
      list-style-type: none !important;
      padding-left: 0 !important;
    }
  </style>
</head>
<body>
  <main class="container">
    <h1 id="car-camping-checklist">Car Camping Checklist</h1>
    <h2 id="absolute-essentials">Absolute Essentials</h2>
    <ul class="task-list">
    <li><label><input type="checkbox" />Booking confirmation and
    government ID</label></li>
    <li><label><input type="checkbox" />Tent</label></li>
    <li><label><input type="checkbox" />Stakes</label></li>
    <li><label><input type="checkbox" />Sleeping bag(s)</label></li>
    <li><label><input type="checkbox" />Air mattress</label></li>
    <li><label><input type="checkbox" />Insulated sleeping
    pads</label></li>
    <li><label><input type="checkbox" />Warm non-cotton
    clothing</label></li>
    <li><label><input type="checkbox" />Headlamps and extra
    batteries</label></li>
    <li><label><input type="checkbox" />Car keys</label></li>
    <li><label><input type="checkbox" />Wallet</label></li>
    <li><label><input type="checkbox" />Phone</label></li>
    <li><label><input type="checkbox" />Cash</label></li>
    </ul>
    <h2 id="misc-equipment">Misc Equipment</h2>
    <ul class="task-list">
    <li><label><input type="checkbox" />Lighter &amp; waterproof
    matches</label></li>
    <li><label><input type="checkbox" />Fire starter</label></li>
    <li><label><input type="checkbox" />Potable water jug</label></li>
    <li><label><input type="checkbox" />Trash bags</label></li>
    <li><label><input type="checkbox" />First aid kit</label></li>
    <li><label><input type="checkbox" />Toiletries</label></li>
    <li><label><input type="checkbox" />Axe</label></li>
    <li><label><input type="checkbox" />Rope</label></li>
    <li><label><input type="checkbox" />Tarp</label></li>
    <li><label><input type="checkbox" />Camp chairs</label></li>
    <li><label><input type="checkbox" />Power bank</label></li>
    <li><label><input type="checkbox" />Camp lantern</label></li>
    <li><label><input type="checkbox" />Board games, cards, or
    books</label></li>
    <li><label><input type="checkbox" />Slip-on shoes or camp
    slippers</label></li>
    <li><label><input type="checkbox" />Swimsuit</label></li>
    <li><label><input type="checkbox" />Towels</label></li>
    </ul>
    <h2 id="kitchen-food">Kitchen &amp; Food</h2>
    <ul>
    <li>Breakfast x 2, Lunch x 3, Dinner x 2</li>
    <li><label><input type="checkbox" />Cooler</label></li>
    <li><label><input type="checkbox" />Camp stove</label></li>
    <li><label><input type="checkbox" />Stove fuel</label></li>
    <li><label><input type="checkbox" />Kettle</label></li>
    <li><label><input type="checkbox" />Frying pan</label></li>
    <li><label><input type="checkbox" />Spatulla</label></li>
    <li><label><input type="checkbox" />Tongs</label></li>
    <li><label><input type="checkbox" />Bread knife</label></li>
    <li><label><input type="checkbox" />Marshmallow or hot dog roasting
    sticks</label></li>
    <li><label><input type="checkbox" />Tinfoil</label></li>
    <li><label><input type="checkbox" />Plates</label></li>
    <li><label><input type="checkbox" />Cups</label></li>
    <li><label><input type="checkbox" />Bowls</label></li>
    <li><label><input type="checkbox" />Utensils</label></li>
    <li><label><input type="checkbox" />Dish soap</label></li>
    <li><label><input type="checkbox" />Dish sponge</label></li>
    <li><label><input type="checkbox" />Paper towel</label></li>
    <li><label><input type="checkbox" />Coffee maker</label></li>
    <li><label><input type="checkbox" />Tumblers</label></li>
    <li><label><input type="checkbox" />Coffee grounds</label></li>
    <li><label><input type="checkbox" />Tea</label></li>
    <li><label><input type="checkbox" />Oat Milk</label></li>
    <li><label><input type="checkbox" />Single serve honey</label></li>
    <li><label><input type="checkbox" />Butter</label></li>
    <li><label><input type="checkbox" />Salt and pepper</label></li>
    <li><label><input type="checkbox" />Shredded cheese for eggs,
    burgers, quesadillas, etc</label></li>
    <li><label><input type="checkbox" />1 dozen eggs for breakfast and
    french toast</label></li>
    <li><label><input type="checkbox" />Breakfast flat buns x
    4</label></li>
    <li><label><input type="checkbox" />French Toast - [ ] Brioche loaf
    - [ ] Maple Syrup - [ ] Raspberries</label></li>
    <li><label><input type="checkbox" />Pre-tinfoiled
    potatoes</label></li>
    <li><label><input type="checkbox" />Italian sausages</label></li>
    <li><label><input type="checkbox" />Sausage buns</label></li>
    <li><label><input type="checkbox" />Burgers</label></li>
    <li><label><input type="checkbox" />Burger buns</label></li>
    <li><label><input type="checkbox" />Ketchup</label></li>
    <li><label><input type="checkbox" />BBQ sauce</label></li>
    <li><label><input type="checkbox" />Mustard</label></li>
    <li><label><input type="checkbox" />Corn relish</label></li>
    <li><label><input type="checkbox" />Savory crepes wrapped in
    tinfoil</label></li>
    <li><label><input type="checkbox" />Tomatoes</label></li>
    <li><label><input type="checkbox" />Cucumbers</label></li>
    <li><label><input type="checkbox" />Quesadillas: - [ ] Packet of
    taco seasoning - [ ] Salsa - [ ] Tortillas - [ ] Bell pepper - [ ]
    Onion - [ ] Sausage</label></li>
    </ul>
  </main>
</body>
</html>
